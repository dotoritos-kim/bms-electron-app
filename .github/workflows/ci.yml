name: CI

on:
  push:
    branches:
      - ship/v1.0-complete
      - main
      - master
  pull_request:
    branches:
      - ship/v1.0-complete
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Typecheck & Unit/Integration Tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspaces (root + vendor/*)
        run: npm ci --legacy-peer-deps

      # Sibling repos do not commit dist/. Build them first so workspace
      # consumers can pick up proper type declarations and runtime modules.
      - name: Build sibling packages
        run: |
          npm run build --workspace=@rhythm-archive/bms-core
          npm run build --workspace=@rhythm-archive/bms-player
          npm run build --workspace=@rhythm-archive/bms-editor

      # Type check is intentionally non-blocking on ship/v1.0-complete:
      # PR #1 (refactor/stage-1-ipc-contract-ssot) explicitly documents
      # pre-existing cross-package TS errors as baseline. Tracked as
      # REFACTOR-PLAN issue #5 (useLocalBmsFile / cross-package import
      # refactor). Build + tests remain blocking.
      - name: Type check (renderer + main/preload) [non-blocking baseline]
        id: typecheck
        continue-on-error: true
        run: npm run type-check

      # i18n parser check: BLOCKING. Verifies that locale JSONs match the
      # `t('ns:key')` calls in source — any new key without a JSON entry (or
      # any orphaned entry that needs sorting) fails the build.
      - name: i18n parser check (locale JSON parity)
        run: npm run i18n:check

      # ESLint Korean-literal regression check: NON-BLOCKING during the
      # incremental Tier 1-7 migration. Tier 1-4 components on the
      # bms-electron-app side still hold ~454 hardcoded literals that the
      # I18N-EXTRACTION-PLAYBOOK is working through. Flip `continue-on-error`
      # to false once migration completes so new regressions block PRs.
      - name: ESLint hardcoded Korean check [non-blocking baseline]
        id: lint-i18n
        continue-on-error: true
        run: npm run lint:i18n

      - name: Run unit + integration + compatibility tests
        run: npm run test -- tests/unit tests/integration tests/compatibility

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-out
          path: out/
          retention-days: 3
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: typecheck-and-test
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspaces (root + vendor/*)
        run: npm ci --legacy-peer-deps

      - name: Build sibling packages
        run: |
          npm run build --workspace=@rhythm-archive/bms-core
          npm run build --workspace=@rhythm-archive/bms-player
          npm run build --workspace=@rhythm-archive/bms-editor

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
