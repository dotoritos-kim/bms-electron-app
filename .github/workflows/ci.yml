name: CI

on:
  push:
    branches:
      - ship/v1.0-complete
      - main
      - master
  pull_request:
    branches:
      - ship/v1.0-complete
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Typecheck & Unit/Integration Tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout bms-electron-app
        uses: actions/checkout@v4
        with:
          path: bms-electron-app

      # The package.json declares file: dependencies on sibling repositories
      # (../bms-core, ../bms-editor, ../bms-player). The default GitHub
      # checkout only fetches one repo, which leaves npm ci unable to resolve
      # those file: paths and produces dozens of TS2307 errors. Check the
      # siblings out next to the main repo so the directory layout matches
      # local development.
      - name: Checkout bms-core
        uses: actions/checkout@v4
        with:
          repository: dotoritos-kim/bms-core
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: bms-core

      - name: Checkout bms-editor
        uses: actions/checkout@v4
        with:
          repository: dotoritos-kim/bms-editor
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: bms-editor

      - name: Checkout bms-player
        uses: actions/checkout@v4
        with:
          repository: dotoritos-kim/bms-player
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: bms-player

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bms-electron-app/package-lock.json

      # Sibling repos do not commit dist/, so build them first so file:
      # dependencies in bms-electron-app expose proper type declarations
      # and runtime modules. Order: bms-core → bms-player → bms-editor
      # (matches the dependency graph).
      - name: Install & build bms-core
        working-directory: bms-core
        run: npm ci --legacy-peer-deps && npm run build

      - name: Install & build bms-player
        working-directory: bms-player
        run: npm ci --legacy-peer-deps && npm run build

      - name: Install & build bms-editor
        working-directory: bms-editor
        run: npm ci --legacy-peer-deps && npm run build

      - name: Install dependencies (bms-electron-app)
        working-directory: bms-electron-app
        run: npm ci

      # Type check is intentionally non-blocking on ship/v1.0-complete:
      # PR #1 (refactor/stage-1-ipc-contract-ssot) explicitly documents
      # pre-existing cross-package TS errors as baseline. Tracked as
      # REFACTOR-PLAN issue #5 (useLocalBmsFile / cross-package import
      # refactor). Build + tests remain blocking.
      - name: Type check (renderer + main/preload) [non-blocking baseline]
        id: typecheck
        working-directory: bms-electron-app
        continue-on-error: true
        run: npm run type-check

      - name: Run unit + integration + compatibility tests
        working-directory: bms-electron-app
        run: npm run test -- tests/unit tests/integration tests/compatibility

      - name: Build
        working-directory: bms-electron-app
        run: npm run build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-out
          path: bms-electron-app/out/
          retention-days: 3
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: typecheck-and-test
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    steps:
      - name: Checkout bms-electron-app
        uses: actions/checkout@v4
        with:
          path: bms-electron-app

      - name: Checkout bms-core
        uses: actions/checkout@v4
        with:
          repository: dotoritos-kim/bms-core
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: bms-core

      - name: Checkout bms-editor
        uses: actions/checkout@v4
        with:
          repository: dotoritos-kim/bms-editor
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: bms-editor

      - name: Checkout bms-player
        uses: actions/checkout@v4
        with:
          repository: dotoritos-kim/bms-player
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: bms-player

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bms-electron-app/package-lock.json

      - name: Install & build bms-core
        working-directory: bms-core
        run: npm ci --legacy-peer-deps && npm run build

      - name: Install & build bms-player
        working-directory: bms-player
        run: npm ci --legacy-peer-deps && npm run build

      - name: Install & build bms-editor
        working-directory: bms-editor
        run: npm ci --legacy-peer-deps && npm run build

      - name: Install dependencies (bms-electron-app)
        working-directory: bms-electron-app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: bms-electron-app
        run: npx playwright install --with-deps

      - name: Build
        working-directory: bms-electron-app
        run: npm run build

      - name: Run E2E tests
        working-directory: bms-electron-app
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: bms-electron-app/test-results/
          retention-days: 7
          if-no-files-found: ignore
