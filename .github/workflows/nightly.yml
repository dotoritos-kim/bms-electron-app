name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - src/renderer/stores/editorStore.ts
          - src/renderer/lib/autoChart.ts
          - src/renderer/lib/keyBindings.ts
          - src/main/ipc/file.ts
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces (root + vendor/*)
        run: npm ci --legacy-peer-deps

      - name: Build sibling packages
        run: |
          npm run build --workspace=@rhythm-archive/bms-core
          npm run build --workspace=@rhythm-archive/bms-player
          npm run build --workspace=@rhythm-archive/bms-editor

      - name: Restore Stryker incremental cache
        uses: actions/cache@v4
        with:
          path: .stryker-tmp
          key: stryker-${{ runner.os }}-${{ strategy.job-index }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'tests/**/*.ts', 'tests/**/*.tsx') }}
          restore-keys: |
            stryker-${{ runner.os }}-${{ strategy.job-index }}-
            stryker-${{ runner.os }}-

      - run: npx stryker run --mutate "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: reports/mutation/

  compatibility-test:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces (root + vendor/*)
        run: npm ci --legacy-peer-deps

      - name: Build sibling packages
        run: |
          npm run build --workspace=@rhythm-archive/bms-core
          npm run build --workspace=@rhythm-archive/bms-player
          npm run build --workspace=@rhythm-archive/bms-editor

      - run: npm run test:compat
