name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  mutation-test:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces (root + vendor/*)
        run: npm ci --legacy-peer-deps

      - name: Build sibling packages
        run: |
          npm run build --workspace=@rhythm-archive/bms-core
          npm run build --workspace=@rhythm-archive/bms-player
          npm run build --workspace=@rhythm-archive/bms-editor

      - run: npm run test:mutation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/

  compatibility-test:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces (root + vendor/*)
        run: npm ci --legacy-peer-deps

      - name: Build sibling packages
        run: |
          npm run build --workspace=@rhythm-archive/bms-core
          npm run build --workspace=@rhythm-archive/bms-player
          npm run build --workspace=@rhythm-archive/bms-editor

      - run: npm run test:compat
