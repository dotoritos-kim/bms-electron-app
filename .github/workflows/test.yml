name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-test:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces (root + vendor/*)
        run: npm ci --legacy-peer-deps

      - name: Build sibling packages
        run: |
          npm run build --workspace=@rhythm-archive/bms-core
          npm run build --workspace=@rhythm-archive/bms-player
          npm run build --workspace=@rhythm-archive/bms-editor

      - name: i18n parser check (fail on missing/added keys)
        run: npm run i18n:check

      - name: ESLint hardcoded-Korean rule
        run: npm run lint:i18n

      - run: npm run test -- tests/unit tests/integration tests/compatibility
      - run: npm run test:coverage -- tests/unit tests/integration tests/compatibility

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  e2e-test:
    runs-on: windows-latest
    needs: unit-test
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces (root + vendor/*)
        run: npm ci --legacy-peer-deps

      - name: Build sibling packages
        run: |
          npm run build --workspace=@rhythm-archive/bms-core
          npm run build --workspace=@rhythm-archive/bms-player
          npm run build --workspace=@rhythm-archive/bms-editor

      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
